<!DOCTYPE html>
<html lang="en">

<head>

  <title>JS-DOM</title>
</head>

<body>
  <h1 id="h1s">111111</h1>
  <h1>22222</h1>
  <h1>33333</h1>

  <script>

    h1s.innerHTML = "我是JS-DOM";
  </script>

</html>
