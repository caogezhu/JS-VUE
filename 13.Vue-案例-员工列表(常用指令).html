<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tlias智能学习辅助系统</title>
  <style>
    /* 顶部导航栏样式 */
    .top-nav {
      background-color: #5c5959;
      /* 灰色背景 */
      padding: 10px;
      display: flex;
      /* 弹性布局 */
      /* 左右对齐 */
      align-items: center;
      justify-content: space-between;
      /* 两端对齐 */
      align-items: center;
      /* 垂直居中 */
    }

    /* 标题样式 */
    .title {
      margin: 0;
      font-weight: bold;
      /* 加粗 */
      color: white;
      /* 设置字体为楷体 */
      font-family: "楷体";
    }

    /* 退出链接样式 */
    .logout-link {
      color: white;
      text-decoration: none;
    }

    .logout-link:hover {
      /* 鼠标悬停时 */
      color: #007bff;
      text-decoration: underline;
    }

    /* ==================== 搜索表单区域 ==================== */
    .search-form {
      padding: 20px;
      background-color: #fff;
      display: flex;
      justify-content: center;
      /* 居中对齐 */
      gap: 15px;
      /* 间距 */
      align-items: center;
      /* 垂直居中 */
    }

    .search-form label {
      font-weight: bold;
      /* 加粗 */
      color: #333;
    }

    .search-form select,
    .search-form input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      width: 150px;
    }

    .btn {
      /* 按钮样式 */
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-query {
      background-color: #007bff;
      color: white;
    }

    .btn-query:hover {
      /* 鼠标悬停时 */
      background-color: #0056b3;
    }

    .btn-reset {
      background-color: #6c757d;
      color: white;
    }

    .btn-reset:hover {
      background-color: #545b62;
    }

    /* ==================== 表格展示区域 ==================== */
    .table-container {
      padding: 20px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      /* 合并边框 */
      background-color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .table th,
    .table td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .table th {
      background-color: #f5f5f5;
      font-weight: bold;
      color: #333;
    }

    /* .table tr:hover {
      鼠标悬停时
      background-color: #c71993;
    } */

    .table img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-edit {
      /* 编辑按钮样式 */
      background-color: #28a745;
      color: white;
      margin-right: 8px;
    }

    .btn-edit:hover {
      background-color: #218838;
    }

    .btn-delete {
      /* 删除按钮样式 */
      background-color: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background-color: #c82333;
    }

    /* ==================== 页脚版权区域 ==================== */
    .footer {
      background-color: #5c5959;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }

    .footer p {
      margin: 5px 0;
      font-size: 14px;
    }

    #content {
      width: 80%;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <div id="content">
    <!-- 顶部导航栏 -->
    <div class="top-nav">
      <h1 class="title">Tlias智能学习辅助系统</h1>
      <a href="#" class="logout-link">退出登录</a>
    </div>

    <!-- 搜索表单区域 -->
    <form class="search-form" action="/search" method="post">
      <label for="name">姓名：</label>
      <input type="text" id="name" name="name" placeholder="请输入姓名">

      <label for="gender">性别：</label>
      <select id="gender" name="gender">
        <option value="">请选择</option>
        <option value="男">男</option>
        <option value="女">女</option>
      </select>

      <label for="position">职位：</label>
      <select id="position" name="position">
        <option value="">请选择</option>
        <option value="班主任">班主任</option>
        <option value="讲师">讲师</option>
        <option value="学工主管">学工主管</option>
        <option value="教研主管">教研主管</option>
        <option value="咨询师">咨询师</option>
      </select>

      <button type="submit" class="btn-query">查询</button>
      <button type="reset" class="btn-reset">清空</button>
    </form>

    <!-- 表格展示区域 -->
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>序号</th>
            <th>姓名</th>
            <th>性别</th>
            <th>头像</th>
            <th>定位</th>
            <th>入场日期</th>
            <th>最后操作时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(e,index) in emplist" :key="e.id">
            <td>{{ index+1 }}</td>
            <td>{{ e.name }}</td>
            <td>{{ e.gender == 1 ? '男' : '女' }}</td>
            <!-- 插值表达式是不能出现在标签内部的 -->
            <td><img :src="e.image" :alt="e.name"></td>

            <!-- v-if：控制元素的显示与隐藏，不频繁切换时使用 -->
            <td>
              <span v-if="e.dept == 1">追击大C</span>
              <span v-else-if="e.dept == 2">记忆舰长</span>
              <span v-else-if="e.dept == 3">我独自满级！</span>
              <span v-else>未知</span>
            </td>

            <!-- v-show：控制元素的显示与隐藏,频繁切换时使用 -->
            <!-- <td>
              <span v-show="e.dept == 1">追击大C</span>
              <span v-show="e.dept == 2">记忆舰长</span>
              <span v-show="e.dept == 3">我独自满级！</span>
            </td> -->

            <td>{{ e.getDate }}</td>
            <td>{{ e.useDate }}</td>
            <td>
              <button class="btn-edit">编辑</button>
              <button class="btn-delete">删除</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 页脚版权区域 -->
    <div class="footer">
      <p>上海米哈游网络科技股份有限公司</p>
      <p>版权所有 Copyright 2006-2024 All Rights Reserved</p>
    </div>
  </div>

  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

    createApp({
      data() {
        return {
          emplist: [{
            id: 1,
            name: '飞霄',
            gender: 2,
            image: 'img/飞霄.jpg',
            dept: '1',
            getDate: '2023-04-26',
            useDate: '2026-05-25 14:30:00',
          },
          {
            id: 2,
            name: '遐蝶',
            gender: 2,
            image: 'img/遐蝶.jpg',
            dept: '2',
            getDate: '2023-07-19',
            useDate: '2026-05-24 09:15:00',
          },
          {
            id: 3,
            name: '银狼LV999',
            gender: 2,
            image: 'img/银狼.jpg',
            dept: '3',
            getDate: '2023-10-11',
            useDate: '2026-05-23 18:45:00',
          }]
        }
      }
    }).mount('#content');
  </script>
</body>

</html>
